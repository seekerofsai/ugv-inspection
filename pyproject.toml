[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugv-inspection"
version = "0.1.0"
description = "Scripted rover inspection with a local simulator and a ROS 2 hardware adapter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ugv-inspection = "ugv_inspection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
